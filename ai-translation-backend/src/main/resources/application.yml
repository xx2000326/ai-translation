server:
  port: 8088

spring:
  application:
    name: ai-translation-backend

  datasource:
    # ===================== 业务库：MySQL（主数据源） =====================
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ai_translation?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    # ===================== 大模型配置（OpenAI 兼容 / DashScope 兼容模式） =====================
    openai:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:qwen-plus}
          temperature: 0.7
      embedding:
        options:
          # text-embedding-v3 支持维度：64/128/256/512/768/1024，与 PGVector VECTOR(1024) 对应
          model: text-embedding-v3
          dimensions: 1024
    # ===================== DeepSeek 模型（多模型路由可选项） =====================
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      chat:
        options:
          model: deepseek-chat

  mvc:
    async:
      request-timeout: 300000

  messages:
    basename: messages
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ===================== 向量库：PostgreSQL + pgvector（RAG 翻译记忆） =====================
app:
  pgvector:
    url: ${PGVECTOR_URL:jdbc:postgresql://127.0.0.1:5432/ai_translation_vector}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    # 翻译记忆向量表名 / 维度（与 SpringAI PgVectorStore 对应）
    table-name: translation_memory
    dimensions: 1024
    # 启动时自动创建表与索引（含 vector 扩展），生产可关闭后手动维护
    initialize-schema: true

  # ===================== 文件存储（源文件上传） =====================
  # type=local 时写本地磁盘（默认）；type=minio 时走 MinIO 对象存储
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./upload-files}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:ai-translation}

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.xx.aitranslation: DEBUG
    org.springframework.ai: INFO
